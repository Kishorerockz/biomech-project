name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kinetix/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./kinetix
        run: npm ci

      - name: Build Web Dashboard
        working-directory: ./kinetix
        run: npm run build

      - name: Capacitor Sync
        working-directory: ./kinetix
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Make Gradle executable
        working-directory: ./kinetix/android
        run: chmod +x ./gradlew

      - name: Build APK with Gradle
        working-directory: ./kinetix/android
        run: ./gradlew assembleDebug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: kinetix/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kinetix/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
