<style>
        body {
            background-color: #121212;
            color: #e5e2e1;
        }
        .card-base {
            background-color: #1A1A1A;
            border: 1px solid #2A2A2A;
            border-radius: 24px;
        }
        .level-2 {
            background-color: #242424;
            border: 1px solid #2A2A2A;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #2A2A2A;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3A3A3A;
        }
        
        /* Waveform Animation */
        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }
        .waveform-path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawLine 2s linear forwards, scrollLeft 5s linear infinite;
        }
        
        /* Pulse Animation */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(197, 2, 11, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(197, 2, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(197, 2, 11, 0); }
        }
        .pulse-dot-red {
            animation: pulse-red 2s infinite;
        }
        
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(0, 255, 127, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(0, 255, 127, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 255, 127, 0); }
        }
        .pulse-dot-green {
            animation: pulse-green 2s infinite;
        }

<body class="bg-surface text-on-surface font-body-sm min-h-screen pb-48">

<div class="card-base p-lg relative flex flex-col items-center justify-center text-center overflow-hidden">

<div class="w-1.5 h-1.5 rounded-full bg-secondary-container pulse-dot-red"></div>
<span class="font-data-label text-[10px] tracking-wider text-secondary-container">NEW PEAK</span>
</div>
<div class="mt-8 mb-4">
<h2 class="font-data-label text-data-label text-on-surface-variant tracking-widest uppercase mb-xs">Last Jump</h2>
<div class="font-display-metrics text-display-metrics text-primary-fixed">44.3 <span class="text-headline-md text-on-surface-variant ml-[-8px]">cm</span></div>
</div>
</div>
</section>

</div>
